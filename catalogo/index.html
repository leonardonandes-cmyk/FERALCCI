<script>
/* ============================================================

const INSTAGRAM   = "https://instagram.com/feralcci";
const TIKTOK      = "https://www.tiktok.com/@feralcci";
const PARCELAS    = 0;   // ex: 3 → mostra "ou 3x de R$ ..." embaixo do preço. 0 = não mostra

/* Onde estão as fotos dos PRODUTOS (busca nessa ordem, sem precisar subir de novo) */
const GH = "https://raw.githubusercontent.com/leonardonandes-cmyk/";
const REPOS_PRODUTO = [
  GH+"DBAESSE-catalogo/main/",
  GH+"cluff-cat-logo/main/",
  GH+"Imagens-Cat-logo-/main/",
  GH+"FERALCCI/main/"

/* Banner e campanhas próprias da FERALCCI ficam no repo FERALCCI (procura lá primeiro) */
const REPOS_SITE = [GH+"FERALCCI/main/", GH+"DBAESSE-catalogo/main/", GH+"Imagens-Cat-logo-/main/"];
const BANNER_PADRAO = "capa-feralcci";

/* Frase de cada categoria (a ORDEM vem da aba Menu da planilha). */
const FRASES_CAT = {
  "lancamentos": "O que acabou de chegar — escolha antes de todo mundo.",
  "papete":      "O conforto que virou desejo — do dia à noite.",
  "salto-bloco": "Altura com firmeza — elegância que sustenta o dia inteiro.",
  "rasteira":    "Leveza pra todo dia — do trabalho ao fim de semana.",
  "sapatilha":   "Clássica e atual — o toque delicado que combina com tudo.",

};

/* Cor escrita na planilha -> bolinha no site */
const CORES = {
  "preto":"#2b2b2b","branco":"#f7f5f0","off-white":"#efe9dd","offwhite":"#efe9dd",
  "creme":"#f0e6d2","marfim":"#f2ece0","areia":"#e2d3ba","bege":"#ddcdb6","natural":"#e4d6bd",

  "rosa":"#d9a7a7","pink":"#d94f83","vermelho":"#8f2f2f","vinho":"#6d2635","bordo":"#5c1f2b",

};

/* ============================================================ */

const $ = s => document.querySelector(s);
const slug = s => (s||"").toString().trim().toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g,"-");
const cap = s => (s||"").toString().trim().replace(/\s+/g," ");
const esc = s => (s||"").toString().replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

function parseCSV(text){
  const rows=[]; let row=[], val="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){val+='"';i++;} else q=false; }
      else val+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(val); val=""; }
      else if(c==='\n'){ row.push(val); rows.push(row); row=[]; val=""; }
      else if(c!=='\r') val+=c;
    }
  }
  row.push(val); rows.push(row);
  return rows.filter(r=>r.some(v=>(v||"").trim()!==""));
}

function mistura(hex,f,alvo){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r+(alvo-r)*f); g=Math.round(g+(alvo-g)*f); b=Math.round(b+(alvo-b)*f);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function corHex(nome){
  const k=slug(nome);
  if(CORES[k]) return CORES[k];
  const claro =/(^|-)(bb|bebe|baby|claro|clara|pastel)(-|$)/.test(k);
  const escuro=/(^|-)(escuro|escura)(-|$)/.test(k);
  const base=k.replace(/(^|-)(bb|bebe|baby|claro|clara|pastel|escuro|escura)(-|$)/g,"-").replace(/^-+|-+$/g,"");
  let hex=CORES[base];
  if(!hex) for(const key in CORES) if(base.includes(key)||k.includes(key)){hex=CORES[key];break;}
  if(!hex) hex="#c4bcae";
  if(claro)  hex=mistura(hex,.58,255);
  if(escuro) hex=mistura(hex,.35,0);
  return hex;
}

/* Extensão real primeiro (.jpg) — a foto certa acerta no 1º pedido; .jfif só no fim, como rede de segurança */
const EXTS=[".jpg",".jpeg",".png",".jfif",".webp",".JPG",".JPEG"];
function urls(ref, repos){
  const enc=encodeURI((ref||"").trim());
  if(!enc) return [];
  const out=[];
  EXTS.forEach(e=>repos.forEach(r=>out.push(r+enc+e)));
  return out;
}
const urlsProduto = ref => urls(ref, REPOS_PRODUTO);
const urlsSite    = ref => urls(ref, REPOS_SITE);

function setHero(ref){
  const lista=urlsSite(ref||BANNER_PADRAO);
  if(!lista.length) return;
  const h=$("#heroImg");
  h.dataset.lista=encodeURIComponent(JSON.stringify(lista));
  h.dataset.i="0";
  h.onerror=function(){ proximaFoto(this); };
  h.src=lista[0];
}
function proximaFoto(img){
  try{
    const lista=JSON.parse(decodeURIComponent(img.dataset.lista||"[]"));
    let i=parseInt(img.dataset.i||"0",10)+1;
    if(i<lista.length){ img.dataset.i=String(i); img.src=lista[i]; }
    else { img.onerror=null; img.removeAttribute("alt"); img.style.opacity=".25"; }
  }catch(e){ img.onerror=null; }
}
function trocaFoto(img,listaEnc){
  img.dataset.lista=listaEnc; img.dataset.i="0";
  try{ img.src=JSON.parse(decodeURIComponent(listaEnc))[0]; }catch(e){}
}
function campErro(img){
  try{
    const lista=JSON.parse(decodeURIComponent(img.dataset.lista||"[]"));
    let i=parseInt(img.dataset.i||"0",10)+1;
    if(i<lista.length){ img.dataset.i=String(i); img.src=lista[i]; return; }
  }catch(e){}
  img.onerror=null;
  const card=img.closest(".camp-card");
  if(card) card.remove();
}

function precoNum(v){
  const s=(v||"").toString().replace(/R\$\s*/i,"").trim();
  if(!s) return NaN;
  // "1.234,56" / "189,90" (padrão BR) ou "189.90" (planilha em formato americano)
  if(s.indexOf(",")>=0) return parseFloat(s.replace(/\./g,"").replace(",","."));
  if(/^\d+\.\d{1,2}$/.test(s)) return parseFloat(s);
  return parseFloat(s.replace(/\./g,""));
}
function precoFmt(v){
  const n=precoNum(v);
  if(isNaN(n)) return (v||"").toString().trim();
  return "R$ " + n.toFixed(2).replace(".",",");
}

/* Link do WhatsApp da Lu com modelo, cor e preço já escritos */
function linkPedido(nome,cor,preco,outlet){
  let t="Olá Lu! Vim pelo catálogo FERALCCI e quero o modelo "+nome;
  if(cor && cor!=="Único") t+=" na cor "+cor;
  if(preco) t+=" ("+preco+(outlet?" · Outlet":"")+")";
  t+=". Qual numeração tem disponível?";
  return "https://wa.me/"+WHATSAPP_LU+"?text="+encodeURIComponent(t);
}

function precoHTML(p){
  if(!MOSTRAR_PRECO || !p.preco) return "";
  const de = (p.outlet && p.de) ? `<span class="price-de">${p.de}</span>` : "";
  let parc="";
  const n=precoNum(p.preco);
  if(PARCELAS>1 && !isNaN(n)) parc=`<div class="parc">ou ${PARCELAS}x de R$ ${(n/PARCELAS).toFixed(2).replace(".",",")}</div>`;
  return `<div class="price">${de}${p.preco}</div>${parc}`;
}

function cardHTML(p){
  const cores=p.cores, first=cores[0];
  const precoTxt = MOSTRAR_PRECO ? p.preco : "";
  const dots=cores.map((c,i)=>
    `<span class="dot${i===0?" on":""}" data-lista="${c.lista}" data-cor="${esc(c.cor)}" style="background:${corHex(c.cor)}" title="${esc(c.cor)}"></span>`
  ).join("");
  const tag = p.outlet ? `<span class="tag tag-outlet">Outlet</span>` : (p.tag?`<span class="tag">${esc(p.tag)}</span>`:"");
  const href = linkPedido(p.nome, first.cor, precoTxt, p.outlet);
  return `<div class="card" data-nome="${esc(p.nome)}" data-preco="${esc(precoTxt)}" data-outlet="${p.outlet?1:0}">
    <a class="frame" href="${href}" target="_blank" rel="noopener">
      <img src="${first.fotos[0]}" data-lista="${first.lista}" data-i="0" onerror="proximaFoto(this)" alt="${esc(p.nome)}" loading="lazy" decoding="async">
      ${tag}
      <span class="buy">Comprar</span>
    </a>
    <div class="meta">
      <div class="name">${esc(p.nome)}</div>
      ${precoHTML(p)}
      ${cores.length>1?`<div class="swatches">${dots}</div>`:""}
      <div class="cor-nome">${cores.length>1?esc(first.cor):""}</div>
      <a class="comprar" href="${href}" target="_blank" rel="noopener">Comprar</a>
    </div>
  </div>`;
}

function secaoHTML(id, eyebrow, titulo, desc, produtos){
  const cards = produtos.length
      ? `<div class="grid">${produtos.map(cardHTML).join("")}</div>`
      : `<div class="vazio">Novidades em breve</div>`;
  return `<section class="collection" id="${id}">
    <div class="col-head">
      <div class="col-eyebrow">${eyebrow}</div>
      ${titulo?`<div class="col-title">${esc(titulo)}</div>`:""}
      ${desc?`<div class="col-desc">${desc}</div>`:""}
      <div class="rule"></div>
    </div>
    ${cards}
  </section>`;
}

function ativar(){
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}})},{threshold:.12});
  document.querySelectorAll(".card").forEach((c,i)=>{c.style.transitionDelay=(i%4*70)+"ms";io.observe(c);});
  document.querySelectorAll(".rule").forEach(r=>io.observe(r));

  // pré-carrega as cores pouco antes do card aparecer (troca de cor instantânea)
  function preloadCores(card){
    card.querySelectorAll(".dot").forEach(d=>{
      let lista; try{ lista=JSON.parse(decodeURIComponent(d.dataset.lista||"[]")); }catch(e){ return; }
      (function tenta(i){ if(i>=lista.length) return; const im=new Image(); im.onerror=function(){tenta(i+1);}; im.src=lista[i]; })(0);
    });
  }
  const pio=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){preloadCores(e.target);pio.unobserve(e.target);}})},{rootMargin:"300px"});
  document.querySelectorAll(".card:not(.camp-card)").forEach(c=>pio.observe(c));

  document.querySelectorAll(".card:not(.camp-card)").forEach(card=>{
    const img=card.querySelector(".frame img");
    const corNome=card.querySelector(".cor-nome");
    const links=card.querySelectorAll(".frame, .comprar");
    card.querySelectorAll(".dot").forEach(d=>{
      d.addEventListener("click",e=>{
        e.preventDefault(); e.stopPropagation();
        img.style.opacity=0;
        setTimeout(()=>{img.onerror=function(){proximaFoto(this)};trocaFoto(img,d.dataset.lista);img.style.opacity=1;},140);
        card.querySelectorAll(".dot").forEach(x=>x.classList.remove("on"));
        d.classList.add("on");
        if(corNome) corNome.textContent=d.dataset.cor;
        // o pedido no WhatsApp acompanha a cor escolhida
        const href=linkPedido(card.dataset.nome, d.dataset.cor, card.dataset.preco, card.dataset.outlet==="1");
        links.forEach(a=>a.href=href);
      });
    });
  });
  initCampCarousel();
}

function initCampCarousel(){
  const vp=document.querySelector(".camp-viewport");
  if(!vp) return;
  const track=vp.querySelector(".camp-track");
  const prev=vp.querySelector(".camp-arrow.prev");
  const next=vp.querySelector(".camp-arrow.next");
  if(!track||!prev||!next) return;
  function passo(){
    const card=track.querySelector(".camp-card");
    const gap=parseFloat(getComputedStyle(track).gap)||18;
    return card ? card.getBoundingClientRect().width+gap : track.clientWidth*.8;
  }
  function atualiza(){
    const max=track.scrollWidth-track.clientWidth-2;
    prev.disabled=track.scrollLeft<=2; next.disabled=track.scrollLeft>=max;
  }
  function avanca(){
    const max=track.scrollWidth-track.clientWidth-2;
    if(track.scrollLeft>=max) track.scrollTo({left:0,behavior:"smooth"});
    else track.scrollBy({left:passo(),behavior:"smooth"});
  }
  const reduz=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const podeAuto=()=>!reduz && track.scrollWidth>track.clientWidth+4;
  const INTERVALO=7000, ESPERA_INICIAL=10000;
  let timer=null, idle=null, jaGirou=false;
  function toca(){ if(!podeAuto()||timer) return; timer=setTimeout(function(){avanca();jaGirou=true;timer=setInterval(avanca,INTERVALO);}, jaGirou?INTERVALO:ESPERA_INICIAL); }
  function para(){ if(timer){ clearTimeout(timer); clearInterval(timer); timer=null; } }
  function reinicia(){ para(); jaGirou=true; toca(); }
  prev.addEventListener("click",()=>{ track.scrollBy({left:-passo(),behavior:"smooth"}); reinicia(); });
  next.addEventListener("click",()=>{ avanca(); reinicia(); });
  track.addEventListener("scroll",atualiza,{passive:true});
  window.addEventListener("resize",atualiza);
  vp.addEventListener("mouseenter",para); vp.addEventListener("mouseleave",toca);
  vp.addEventListener("touchstart",()=>{ para(); clearTimeout(idle); },{passive:true});
  vp.addEventListener("touchend",()=>{ clearTimeout(idle); idle=setTimeout(toca,5000); },{passive:true});
  atualiza(); toca();
}

const ehOutletCat = s => (s==="outlet"||s==="oferta"||s==="ofertas"||s==="sale");

async function montar(textoPlanilha, textoMenu){
  let txt=textoPlanilha;
  if(txt==null){
    try{ const r=await fetch(PLANILHA_CSV+"&t="+Date.now()); txt=await r.text(); }
    catch(e){ $("#status").textContent="Não foi possível carregar a coleção agora. Tente novamente em instantes."; return; }
  }
  const rows=parseCSV(txt);
  if(rows.length<2){ $("#status").textContent="A coleção ainda não tem produtos."; return; }

  // ordem do menu = aba Menu (coluna A). Se não tiver, usa a ordem-padrão.
  try{
    let tm=textoMenu;
    if(tm==null && MENU_CSV){ const rm=await fetch(MENU_CSV+"&t="+Date.now()); tm=await rm.text(); }
    if(tm){
      const linhas=parseCSV(tm).map(l=>(l[0]||"").trim()).filter(x=>x);
      if(linhas.length && ["menu","categoria","categorias","ordem"].includes(slug(linhas[0]))) linhas.shift();
      if(linhas.length) ORDEM_MENU=linhas;
    }
  }catch(e){}

  const head=rows[0].map(h=>slug(h));
  const achar = f => head.findIndex(f);
  const idx={
    cat:  achar(h=>h.startsWith("categoria")),
    nome: achar(h=>h.startsWith("nome")),
    cor:  achar(h=>h.startsWith("cor")),
    // "Preço Varejo" tem prioridade; se não existir, usa "Preço"
    preco:(()=>{ const v=achar(h=>h.startsWith("preco-varejo")||h==="varejo"); return v>=0?v:achar(h=>h==="preco"||h.startsWith("preco") && !h.startsWith("preco-de") && !h.startsWith("preco-outlet") && !h.startsWith("precocheio") && !h.startsWith("preco-cheio")); })(),
    poutlet: achar(h=>h.startsWith("preco-outlet")),
    tag:  achar(h=>h.startsWith("tag")),
    out:  achar(h=>h.startsWith("outlet")||h.startsWith("oferta")),
    de:   achar(h=>h==="de"||h.startsWith("de-")||h.startsWith("preco-de")||h.startsWith("precocheio")||h.startsWith("preco-cheio")),
    ref:  achar(h=>h.startsWith("referencia")),
    ativo:achar(h=>h==="ativo"||h==="varejo-sim"||h==="mostrar")
  };

  const mapa={}, ordem=[], campanhas=[];
  let bannerRef="";

  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    const cat=cap(r[idx.cat]), nome=cap(r[idx.nome]);
    const ref=(r[idx.ref]||"").trim();
    const sc=slug(cat);

    // linhas exclusivas da revenda / faixas de SALE da DBAESSE — ignoradas aqui (antes de tudo, pra não confundir o banner)
    if(["campanharevenda","campanha-revenda","bannerrevenda","banner-revenda","teasersale","faixasale","teaser"].includes(sc)) continue;
    // coluna opcional "Ativo": "Não" esconde o produto da vitrine
    if(idx.ativo>=0 && ["nao","n","0"].includes(slug(r[idx.ativo]))) continue;
    if(!ref) continue;

    if(sc==="banner" || slug(nome)==="banner"){ bannerRef=ref; continue; }
    if(sc==="campanha" || sc==="campanhas"){
      // na prévia (planilha DBAESSE) as campanhas da DBAESSE não entram — a FERALCCI tem campanhas próprias
      if(!PRONTA) continue;
      const fs=urlsSite(ref);
      if(fs.length) campanhas.push({nome:nome||"Campanha FERALCCI",fotos:fs,lista:encodeURIComponent(JSON.stringify(fs))});
      continue;
    }
    if(!nome) continue;

    const chave=slug(nome);
    if(!mapa[chave]){ mapa[chave]={cat:"",nome:nome,tag:cap(r[idx.tag]),precoBase:"",cores:[]}; ordem.push(chave); }
    const p=mapa[chave];

    const outlet = ehOutletCat(sc) || (idx.out>=0 && slug(r[idx.out])==="sim");
    if(!ehOutletCat(sc) && cat && !p.cat) p.cat=cat;
    if(!p.tag && cap(r[idx.tag])) p.tag=cap(r[idx.tag]);

    let precoLinha = idx.preco>=0 ? precoFmt(r[idx.preco]) : "";
    let deLinha    = idx.de>=0 ? precoFmt(r[idx.de]) : "";
    if(outlet && idx.poutlet>=0 && (r[idx.poutlet]||"").trim()){
      // com coluna "Preço Outlet": o preço normal vira o riscado
      if(!deLinha) deLinha=precoLinha;
      precoLinha=precoFmt(r[idx.poutlet]);
    }
    if(!outlet && !p.precoBase && precoLinha) p.precoBase=precoLinha;

    const fotos=urlsProduto(ref);
    if(fotos.length) p.cores.push({
      cor:cap(r[idx.cor])||"Único", fotos:fotos, lista:encodeURIComponent(JSON.stringify(fotos)),
      outlet:outlet, preco:precoLinha, de:deLinha
    });
  }

  const produtos=ordem.map(k=>mapa[k]).filter(p=>p.cores.length);
  if(!produtos.length){ $("#status").textContent="A coleção ainda não tem produtos com foto."; return; }
  if(bannerRef) setHero(bannerRef);

  // card a partir das cores do contexto (coleção = preço cheio; outlet = só as cores em outlet)
  function montaCard(p, cores, isOutlet){
    const preco=(cores.find(c=>c.preco)||{}).preco || p.precoBase || "";
    let de=(cores.find(c=>c.de)||{}).de || "";
    if(isOutlet && !de && p.precoBase && p.precoBase!==preco) de=p.precoBase;
    return {nome:p.nome, preco:preco, de:de, tag:isOutlet?"":p.tag, outlet:isOutlet, cores:cores};
  }

  let htmlCamp="", menuCamp="";
  if(campanhas.length){
    menuCamp=`<a href="#campanhas">Campanhas</a>`;
    const cards=campanhas.map(c=>`
      <div class="card camp-card"><div class="frame">
        <img src="${c.fotos[0]}" data-lista="${c.lista}" data-i="0" onerror="campErro(this)" alt="${esc(c.nome)}" loading="lazy" decoding="async">
      </div></div>`).join("");
    htmlCamp=`<section class="campanhas" id="campanhas">
      <div class="col-head"><div class="col-eyebrow">Editorial</div><div class="col-title">Campanhas</div><div class="rule"></div></div>
      <div class="camp-viewport">
        <button class="camp-arrow prev" aria-label="Anterior">&#8249;</button>
        <div class="camp-track">${cards}</div>
        <button class="camp-arrow next" aria-label="Próximo">&#8250;</button>
      </div>
    </section>`;
  }

  let html="", menu="";
  const usadas=new Set();
  function secaoCat(nomeCat){
    const id=slug(nomeCat);
    if(usadas.has(id) || ehOutletCat(id)) return;
    usadas.add(id);
    const lista=produtos.filter(p=>slug(p.cat)===id)
      .map(p=>montaCard(p, p.cores.filter(c=>!c.outlet), false))
      .filter(c=>c.cores.length);
    if(!lista.length) return;
    menu+=`<a href="#${id}">${esc(nomeCat)}</a>`;
    html+=secaoHTML(id,"Coleção",nomeCat,FRASES_CAT[id]||"",lista);
  }
  ORDEM_MENU.forEach(secaoCat);
  produtos.forEach(p=>{ if(p.cat) secaoCat(p.cat); });

  // OUTLET — sempre no FIM, separado da coleção
  const outlet=[];
  produtos.forEach(p=>{ const cs=p.cores.filter(c=>c.outlet); if(cs.length) outlet.push(montaCard(p,cs,true)); });
  let menuOutlet="";
  if(outlet.length){
    menuOutlet=`<a class="menu-outlet" href="#outlet">Outlet</a>`;
    html+=`<section class="outlet" id="outlet"><div class="outlet-in">
        <div class="col-head">
          <div class="col-eyebrow">Últimos pares</div>
          <div class="col-title">Outlet</div>
          <div class="col-desc">Modelos selecionados em quantidade limitada. Enquanto durar o estoque.</div>
          <div class="rule"></div>
        </div>
        <div class="grid">${outlet.map(cardHTML).join("")}</div>
      </div>
      <div class="outlet-grupo">
        <p>Receba primeiro os pares do Outlet</p>
        <a href="${GRUPO_OUTLET}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.2 1.3-1.9 1.4-.5.1-1.1.2-3.4-.7-2.9-1.2-4.7-4.1-4.9-4.3-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.2.1.4.1.6-.1l.7-.9c.2-.2.4-.2.6-.1l2 .9c.2.1.4.2.4.3.1.2.1.7-.1 1.4z"/></svg>
          Entrar no grupo Outlet
        </a>
      </div>
    </section>`;
  }

  $("#menu").innerHTML=menuCamp+menu+menuOutlet;
  $("#conteudo").innerHTML=htmlCamp+html;
  ativar();
}

$("#linkIg").href=INSTAGRAM;
